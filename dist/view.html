<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>GIGROUP · Read-only view</title><style>
*{box-sizing:border-box}body{margin:0;background:#111315;color:#edf0f3;font:14px Arial,sans-serif}header{padding:24px 5%;border-bottom:1px solid #363a40;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px;margin:0}h1 span{color:#f49b54}.badge{border:1px solid #705237;color:#ffc18d;padding:9px;border-radius:8px;font-size:12px}main{max-width:1550px;margin:auto;padding:24px 5%}.muted{color:#a2abb8;font-size:12px;line-height:1.7}.stats,.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card,.stat{background:linear-gradient(135deg,#ffffff14,transparent 60%),#1b1d20;border:1px solid #363a40;border-radius:13px;padding:20px;min-width:0;overflow-wrap:anywhere;box-shadow:inset 0 1px #ffffff20}.card:hover{background:linear-gradient(135deg,#ffffff28,transparent 60%),#1b1d20}.stat strong{display:block;font-size:29px;margin-top:10px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0 15px}button,input,select{background:#22262b;color:#edf0f3;border:1px solid #434a53;border-radius:8px;padding:12px;font:inherit}button{cursor:pointer;background-image:linear-gradient(#ffffff15,transparent)}button.active{color:#f49b54;border-color:#f49b54}input{flex:1;min-width:160px}.code{color:#f8b078;font-weight:bold;white-space:nowrap;display:inline-block;border:0;background:none;padding:0;font-size:14px}.qty{font-size:26px;margin:20px 0 10px}.card h3{font-size:14px;line-height:1.6;min-height:42px}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12px;line-height:1.5}.details small{display:block;color:#a2abb8;margin-bottom:3px}.wide{grid-column:1/-1}.footer{display:flex;align-items:center;gap:15px;margin:22px 0}#notice{color:#ffc18d}button:disabled{opacity:.4;cursor:default}@media(max-width:1100px){.cards,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.cards{grid-template-columns:1fr}main{padding:20px 15px}header{padding:20px 15px}.stats{gap:10px}.stat{padding:14px}.stat strong{font-size:25px}.bar input{flex-basis:100%}}
</style><header><h1>GI<span>GROUP</span> · Store Desk</h1><span class="badge">READ ONLY</span></header><main><p class="muted">Live company records · Viewing only</p><div id="stats" class="stats"></div><div class="bar"><button data-tab="inventory" class="active">Inventory</button><button data-tab="in">Stock In</button><button data-tab="out">Stock Out</button><button id="refresh">Refresh data</button></div><div class="bar"><input id="search" placeholder="Search item, applicant, department or location…" aria-label="Search records"><select id="status" aria-label="Status"><option value="all">All statuses</option><option>Pending</option><option>Partial</option><option>Complete</option></select></div><p id="notice" role="status">Loading company data…</p><p id="count" class="muted"></p><div id="cards" class="cards"></div><div class="footer"><button id="prev">Previous</button><span id="pagination"></span><button id="next">Next</button></div><p id="updated" class="muted"></p></main><script src="/view.js"></script></html>
